[package]
name = "cargo-affected"
version = "0.3.1"
edition = "2021"
rust-version = "1.94"
description = "Run only the tests affected by git changes, using LLVM coverage."
license = "MIT OR Apache-2.0"
repository = "https://github.com/max-sixty/cargo-affected"
readme = "README.md"
keywords = ["test", "coverage", "cargo-subcommand", "incremental", "nextest"]
categories = ["development-tools::testing", "development-tools::cargo-plugins"]
authors = ["Maximilian Roos <m@maxroos.com>"]

[[bin]]
name = "cargo-affected"
path = "src/main.rs"

[dependencies]
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
globset = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"
