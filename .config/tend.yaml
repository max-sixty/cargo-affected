bot_name: cargo-affected-bot
workflows:
  review:
    harness: codex
    model: gpt-5.6-sol
  ci-fix:
    watched_workflows:
    - ci

# The functional suite shells out to `cargo nextest` and to the `llvm-tools`
# binaries (`llvm-profdata`, `llvm-cov`) — see CLAUDE.md. Neither ships with the
# runner image, so they are installed here, before the agent starts: the agent
# sees the job's own checkout and home, so what this step installs is on its
# PATH. Each install is followed by an assertion so a broken toolchain fails
# setup rather than surfacing mid-session, per this repo's "fail loudly, no
# fallback paths" principle.
#
# The nextest version tracks the `=0.9.132` pin in `ci.yaml` — what agents
# verify against nextest is nextest's own surface (the `list --message-format
# json` schema, `filter-match.status`, the generated `default-filter` config),
# so a sandbox on a newer release would let a session report "verified" against
# a nextest that CI never runs. Bump both together.
#
# `shell: bash` is carried over from what `sandbox_setup` emitted, which is why
# the regenerated workflows are byte-identical. It selects
# `bash --noprofile --norc -eo pipefail`, where a bare `run:` would get the
# runner default of `bash -e` and report only `tar`'s status for the
# `curl | tar` line. `tar` exits non-zero on a truncated or empty stream, so
# `-e` alone already catches an ordinary bad download; `pipefail` covers the
# residue — a `curl` that fails after `tar` has the whole archive.
setup:
  - run: |-
      rustup component add llvm-tools
      test -x "$(rustc --print target-libdir)/../bin/llvm-profdata"
      curl -sSfL https://get.nexte.st/0.9.132/linux | tar zxf - -C "$HOME/.cargo/bin"
      cargo nextest --version
    shell: bash
