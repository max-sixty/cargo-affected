name: tend-review-runs
on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:

jobs:
  review-runs:
    if: github.repository_owner == 'max-sixty' && vars.TEND_ENABLED != 'false'
    runs-on: ubuntu-24.04
    environment:
      name: tend
      deployment: false
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.TEND_BOT_TOKEN }}

      - run: |-
          rustup component add llvm-tools
          test -x "$(rustc --print target-libdir)/../bin/llvm-profdata"
          curl -sSfL https://get.nexte.st/0.9.132/linux | tar zxf - -C "$HOME/.cargo/bin"
          cargo nextest --version
        shell: bash

      - uses: max-sixty/tend/claude@0.2.15
        with:
          github_token: ${{ secrets.TEND_BOT_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          bot_name: cargo-affected-bot
          model: opus
          checkout_mode: base
          base_branch: ${{ github.event.repository.default_branch }}
          prompt: |2
            /tend-ci-runner:review-runs
