name: ci

# Runner versions are pinned to avoid surprise breaking changes from -latest
# migrations. The matrix covers `x86_64-pc-windows-msvc` alongside Linux and
# macOS — `x86_64-pc-windows-gnu` and `aarch64-pc-windows-msvc` are
# documented as broken upstream (rust-lang/rust#111098, #150123) and are
# excluded.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Checkout is the only step here that touches the API, so `contents: read` is
# the whole requirement. Without this key the token inherits the repo-wide
# default, which on a `push` to main can be read/write across every scope —
# every other workflow in this repo pins its own, so this one was the outlier.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI does clean builds, so incremental compilation tracking adds I/O overhead
  # with no benefit.
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - name: 📂 Checkout code
      uses: actions/checkout@v6

    - name: 💰 Cache
      uses: Swatinem/rust-cache@v2

    - name: 🎨 Format
      run: cargo fmt --check

    - name: 🔍 Clippy
      run: cargo clippy --all-targets -- -D warnings

    # Broken intra-doc links compile fine and fail nothing else, so the only
    # thing standing between a `[`Foo`]` typo and a dead reference is this gate.
    - name: 📚 Docs
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps --document-private-items

  # `rust-version` in Cargo.toml is a promise to everyone installing from
  # crates.io, and nothing else in this workflow builds with anything but
  # current stable — so without this the declared MSRV drifts upward silently
  # and breaks installs that CI never sees.
  msrv:
    runs-on: ubuntu-24.04
    steps:
    - name: 📂 Checkout code
      uses: actions/checkout@v6

    - name: 💰 Cache
      uses: Swatinem/rust-cache@v2
      with:
        # Own cache — `cargo msrv verify` builds with older toolchains whose
        # rustc hash never matches the shared (stable) cache.
        cache-bin: "false"
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-msrv
        version: "=0.19.3"

    - name: Verify minimum rust version
      run: cargo msrv verify

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: macos-15
            name: macos
          - os: windows-2022
            name: windows
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
    - name: 📂 Checkout code
      uses: actions/checkout@v6

    - name: Install llvm-tools
      run: rustup component add llvm-tools

    - name: Install cargo-nextest
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-nextest
        version: "=0.9.132"

    - name: 💰 Cache
      uses: Swatinem/rust-cache@v2

    - name: 🧪 Tests
      run: cargo test
