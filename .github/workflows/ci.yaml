name: ci

# Runner versions are pinned to avoid surprise breaking changes from -latest
# migrations. The matrix covers `x86_64-pc-windows-msvc` alongside Linux and
# macOS — `x86_64-pc-windows-gnu` and `aarch64-pc-windows-msvc` are
# documented as broken upstream (rust-lang/rust#111098, #150123) and are
# excluded.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # CI does clean builds, so incremental compilation tracking adds I/O overhead
  # with no benefit.
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - name: 📂 Checkout code
      uses: actions/checkout@v6

    - name: 💰 Cache
      uses: Swatinem/rust-cache@v2

    - name: 🎨 Format
      run: cargo fmt --check

    - name: 🔍 Clippy
      run: cargo clippy --all-targets -- -D warnings

    # Broken intra-doc links compile fine and fail nothing else, so the only
    # thing standing between a `[`Foo`]` typo and a dead reference is this gate.
    - name: 📚 Docs
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps --document-private-items

    # `typos` and `no-dbg` are declared in `.pre-commit-config.yaml` but had no
    # gate anywhere: that file's `ci:` block configures pre-commit.ci, which is
    # not installed on this repo, so those hooks only ever ran on a
    # contributor's machine. Running the config here rather than restating
    # individual hooks keeps `.pre-commit-config.yaml` the single list — a hook
    # added there is enforced without a second edit to this file.
    - name: 🐍 Python for pre-commit
      uses: actions/setup-python@v6
      with:
        # Without this the action installs nothing and the hooks run against
        # whatever interpreter the runner image happens to ship — the one
        # dependency of this job left outside the pinning the header describes.
        python-version: "3.13"

    - name: 💰 pre-commit cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: 🪝 pre-commit
      env:
        # Mirrors the `ci.skip` list in `.pre-commit-config.yaml`: `fmt` and
        # `clippy` duplicate the two steps above, and `cargo-lock` would add a
        # second full build to this job. The lockfile therefore stays ungated
        # in CI, as it was before this step existed.
        SKIP: fmt,clippy,cargo-lock
      run: |
        # Pinned like `cargo-nextest` and `cargo-msrv` below: floating, this
        # would be the one version in the job that can change between two runs
        # of the same commit, landing a breaking release as a red `lint` on an
        # unrelated PR. Moves by hand, as the other pins do.
        python -m pip install pre-commit==4.6.2
        pre-commit run --all-files --show-diff-on-failure --color=always

  # `rust-version` in Cargo.toml is a promise to everyone installing from
  # crates.io, and nothing else in this workflow builds with anything but
  # current stable — so without this the declared MSRV drifts upward silently
  # and breaks installs that CI never sees.
  msrv:
    runs-on: ubuntu-24.04
    steps:
    - name: 📂 Checkout code
      uses: actions/checkout@v6

    - name: 💰 Cache
      uses: Swatinem/rust-cache@v2
      with:
        # Own cache — `cargo msrv verify` builds with older toolchains whose
        # rustc hash never matches the shared (stable) cache.
        cache-bin: "false"
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-msrv
        version: "=0.19.3"

    - name: Verify minimum rust version
      run: cargo msrv verify

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
          - os: macos-15
            name: macos
          - os: windows-2022
            name: windows
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
    - name: 📂 Checkout code
      uses: actions/checkout@v6

    - name: Install llvm-tools
      run: rustup component add llvm-tools

    - name: Install cargo-nextest
      uses: baptiste0928/cargo-install@v3
      with:
        crate: cargo-nextest
        version: "=0.9.132"

    - name: 💰 Cache
      uses: Swatinem/rust-cache@v2

    - name: 🧪 Tests
      run: cargo test
