name: release

# Publishes cargo-affected to crates.io when a version tag is pushed.
#
# Auth is via crates.io Trusted Publishing (GitHub Actions OIDC): the job mints a
# short-lived, auto-revoked token per run instead of a long-lived API token. This
# requires a Trusted Publisher to be configured for the crate on crates.io, scoped
# to this repo, the `release.yaml` workflow, and the `release` environment.

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish-cargo:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      # `--locked` asserts the committed `Cargo.lock` is already in sync with
      # `Cargo.toml`. Without it, an out-of-sync lock is silently rewritten
      # during the verify build and the rewritten lock ships inside the
      # published crate, so `cargo install --locked cargo-affected` can pin
      # dependency versions no CI job built — a bumped or added dependency
      # requirement gets re-resolved to newest-compatible at publish time.
      # With `--locked` the publish fails instead.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --package cargo-affected
