name: release

# Publishes cargo-affected to crates.io and creates a GitHub Release when a
# version tag is pushed.
#
# Auth is via crates.io Trusted Publishing (GitHub Actions OIDC): the job mints a
# short-lived, auto-revoked token per run instead of a long-lived API token. This
# requires a Trusted Publisher to be configured for the crate on crates.io, scoped
# to this repo, the `release.yaml` workflow, and the `release` environment.

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish-cargo:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --package cargo-affected

  github-release:
    needs: publish-cargo
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
